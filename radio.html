<style>
:root{
    --primary:#2563eb;
    --dark:#0f172a;
    --light:#f8fafc;
    --card:#ffffff;
    --shadow:0 10px 25px rgba(0,0,0,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:var(--light);
}

.container{
    width:min(1200px,95%);
    margin:auto;
}

.radio-section{
    padding:60px 0;
}

.section-title{
    text-align:center;
    font-size:2rem;
    margin-bottom:10px;
}

.section-subtitle{
    text-align:center;
    color:#64748b;
    margin-bottom:30px;
}

.radio-search{
    width:100%;
    max-width:500px;
    margin:0 auto 30px;
    display:block;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
}

.radio-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.radio-card{
    background:var(--card);
    padding:20px;
    border-radius:16px;
    text-align:center;
    box-shadow:var(--shadow);
    position:relative;
    transition:.3s;
}

.radio-card:hover{
    transform:translateY(-5px);
}

.live{
    position:absolute;
    top:10px;
    right:10px;
    background:red;
    color:#fff;
    font-size:11px;
    padding:4px 8px;
    border-radius:20px;
}

.radio-logo{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#e2e8f0;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 15px;
    font-size:30px;
}

.radio-card h3{
    margin-bottom:5px;
}

.radio-card p{
    color:#64748b;
    margin-bottom:15px;
}

.play-btn{
    background:var(--primary);
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
}

.player-box{
    position:sticky;
    bottom:0;
    margin-top:40px;
    background:#fff;
    padding:5px;
    border-radius:10px;
    box-shadow:var(--shadow);
	display:none;
}

.player-box audio{
    width:100%;
}

.now-playing{
    margin-bottom:10px;
    font-weight:bold;
}
.player-controls{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.stop-btn,
.close-btn{
    border:none;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    color:white;
}

.stop-btn{
    background:#f59e0b;
}

.close-btn{
    background:#ef4444;
}

.stop-btn:hover{
    background:#d97706;
}

.close-btn:hover{
    background:#dc2626;
}

body {

}





.sticky {

  position: fixed;

  top: 0;

  width: 100%

}



.sticky + .content {

  padding-top: 0px;

}



* {box-sizing: border-box;}

.mySlides {display: none;}

img {vertical-align: middle;}



/* Slideshow container */

.slideshow-container {

  max-width: 1000px;

  position: relative;

  margin: auto;

}



/* Caption text */

.text {

  color: #f2f2f2;

  font-size: 15px;

  padding: 8px 12px;

  position: absolute;

  bottom: 8px;

  width: 100%;

  text-align: center;

}



/* Number text (1/3 etc) */

.numbertext {

  color: #f2f2f2;

  font-size: 12px;

  padding: 8px 12px;

  position: absolute;

  top: 0;

}



/* The dots/bullets/indicators */

.dot {

  height: 15px;

  width: 15px;

  margin: 0 2px;

  background-color: rgb(0,120,201);

  border-radius: 50%;

  display: inline-block;

  transition: background-color 0.6s ease;

}



.active {

  background-color: #2196F3;

}



/* Fading animation */

.fade {

  -webkit-animation-name: fade;

  -webkit-animation-duration: 1.5s;

  animation-name: fade;

  animation-duration: 1.5s;

}



@-webkit-keyframes fade {

  from {opacity: .4} 

  to {opacity: 1}

}



@keyframes fade {

  from {opacity: .4} 

  to {opacity: 1}

}



/* On smaller screens, decrease text size */

@media only screen and (max-width: 300px) {

  .text {font-size: 11px}

}



/* Float four columns side by side */

.columncard {

  float: left;

  width: 25%;

  padding: 0 10px;

}



/* Remove extra left and right margins, due to padding */

.rowcard {margin: 0 -5px;}



/* Clear floats after the columns */

.rowcard:after {

  content: "";

  display: table;

  clear: both;

}



/* Responsive columns */

@media screen and (max-width: 600px) {

  .columncard {

    width: 100%;

    display: block;

    margin-bottom: 20px;

  }

}



/* Style the counter cards */

const grid = document.getElementById('radioGrid');

function renderStations(list){

grid.innerHTML='';

list.forEach(r=>{

grid.innerHTML += `
<div class="radio-card">

<span class="live">LIVE</span>

<div class="radio-logo">${r.logo}</div>

<h3>${r.name}</h3>

<p>${r.freq}<br>${r.city}</p>

<button
class="play-btn"
onclick="playRadio('${r.stream}','${r.name}')">

▶ Listen

</button>

</div>
`;

});

}

renderStations(radios);

function playRadio(url,name){

    if(url===''){
        alert('Stream URL not available yet.');
        return;
    }

    document.querySelector('.player-box')
    .style.display='block';

    document.getElementById('nowPlaying')
    .innerHTML='🎧 Now Playing: '+name;

    const player =
    document.getElementById('radioPlayer');

    player.src=url;

    player.play();

}

document
.getElementById('radioSearch')
.addEventListener('keyup',function(){

let value=this.value.toLowerCase();

let filtered=radios.filter(r=>
r.name.toLowerCase().includes(value)
);

renderStations(filtered);

});

function stopRadio(){

    const player =
    document.getElementById('radioPlayer');

    player.pause();
    player.currentTime = 0;

    document.getElementById('nowPlaying')
    .innerHTML = '⏹ Playback Stopped';

}

function closePlayer(){

    const player =
    document.getElementById('radioPlayer');

    player.pause();
    player.removeAttribute('src');
    player.load();

    document.getElementById('nowPlaying')
    .innerHTML = 'No Station Selected';

    document.querySelector('.player-box')
    .style.display = 'none';

}

</script>
